name: Release

# Percorso di rilascio Android (docs/release-engineering.md, sezione "Secrets del rilascio").
# Solo a mano: nessun secret viene letto da pull request o da push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    name: AAB firmato e upload sul track interno
    runs-on: ubuntu-latest
    environment: release # approvazione manuale configurabile sull'environment
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PACKAGES_SIGNING_KEY_BASE64: ${{ secrets.PACKAGES_SIGNING_KEY_BASE64 }}
    steps:
      - name: Secrets presenti (altrimenti ci si ferma prima di ogni build)
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                   ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON PACKAGES_SIGNING_KEY_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets mancanti:$missing. Elenco e creazione: docs/release-engineering.md, sezione \"Secrets del rilascio\"."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Chiave dei pacchetti (quella dello studio, la cui parte pubblica è in trusted_key.dart)
        run: |
          mkdir -p studio/keys
          echo "$PACKAGES_SIGNING_KEY_BASE64" | base64 -d > studio/keys/signing.key
      - name: Contenuti approvati, impacchettati e firmati
        run: python studio/sync_assets.py --release
      - name: Pacchetti di release
        run: python studio/pack.py --release --sign
      - name: Firma Android (key.properties fuori da git, rimosso a fine job)
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/android/key.properties
      - name: Build AAB di release
        working-directory: app
        run: |
          flutter pub get
          flutter build appbundle --release
      - name: Distribuzione rifiutata se check_release.py blocca
        run: python studio/check_release.py --aab app/build/app/outputs/bundle/release/app-release.aab
      - name: Upload sul track interno di Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.markg981.mirabo
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
      - name: Pulizia dei file con le chiavi
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks" studio/keys/signing.key
