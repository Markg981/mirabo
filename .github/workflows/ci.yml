name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  content:
    name: Valida e impacchetta i contenuti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - name: Valida le storie
        run: python studio/validate.py
      - name: Matrice educativa e promesse vietate
        run: python studio/check_goals.py
      - name: Inventario e catalogo di lancio (coerenza; la release si controlla con --release)
        run: python studio/catalog.py
      - name: Schede delle attività pratiche (Montessori sì o no, schermo, nessun premio)
        run: python studio/practice.py
      - name: Nessun invito a restare o a tornare (battute del compagno e frasi lato bambino)
        run: python studio/check_retention.py
      - name: Comportamenti da contenere e strategie non miracolose (docs/content-safety.md)
        run: python studio/check_messages.py
      - name: Campi provvisori di informativa e store (informativo; la release usa --release)
        run: python studio/check_privacy.py
      - name: Validazione con le famiglie, soglie di correzione e sequenza del lavoro (docs/launch/validation.md)
        run: python studio/validation.py
      - name: Rilascio e sostenibilità, rinvii, registro delle criticità (docs/launch/release.md; la decisione usa --decide)
        run: python studio/release.py
      - name: Pacchetti non firmati (la firma richiede la chiave privata, che non è in CI)
        run: python studio/pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacchetti
          path: dist/*.mirabo

  dipendenze:
    name: Osserva le dipendenze (informativo, non blocca)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Versione esatta da app/pubspec.yaml: la build non cambia quando stable avanza.
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Dipendenze Dart/Flutter non aggiornate
        working-directory: app
        run: flutter pub outdated || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnerabilità note delle dipendenze Python dello studio
        run: |
          pip install pip-audit
          pip-audit -r studio/requirements.txt || true

  rilascio:
    name: Controllo di rilascio (bloccante sui tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - name: Distribuzione rifiutata se check_release.py blocca (docs/release-engineering.md)
        run: python studio/check_release.py

  android:
    name: Analizza, testa e compila Android
    runs-on: ubuntu-latest
    needs: [content, rilascio]
    # rilascio è saltato fuori dai tag: si prosegue; se fallisce, la build non parte
    if: ${{ !cancelled() && !failure() }}
    steps:
      # L'immagine ubuntu-latest lascia poco disco libero: senza questo passo la
      # build Gradle si ferma con "No space left on device".
      - name: Libera spazio sul runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Versione esatta da app/pubspec.yaml: la build non cambia quando stable avanza.
          flutter-version-file: app/pubspec.yaml
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - name: Chiave di firma effimera per la CI
        run: python studio/keygen.py
      - name: "Sincronizza gli asset (APK di debug e test, non una release: anche le bozze)"
        run: python studio/sync_assets.py --include-drafts
      - name: Genera le cartelle piattaforma
        working-directory: app
        run: flutter create . --org com.markg981 --project-name mirabo --platforms android,ios
      - name: Dipendenze esatte di app/pubspec.lock
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Inventario dati e dipendenze (docs/privacy)
        run: python studio/check_inventory.py --require-lock
      - name: Analizza e testa (esito riportato come commento sul commit)
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1; a=$?
          flutter test > /tmp/test.txt 2>&1; t=$?
          set -e
          {
            echo "## CI — analyze: $([ $a -eq 0 ] && echo OK || echo FAIL) · test: $([ $t -eq 0 ] && echo OK || echo FAIL)"
            echo; echo '```'; tail -n 80 /tmp/analyze.txt; echo '```'
            echo; echo '```'; grep -vE '^\s*$' /tmp/test.txt | tail -n 80; echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/comment.md > /dev/null
          [ $a -eq 0 ] && [ $t -eq 0 ]
      - working-directory: app
        run: flutter build apk --debug
      - name: Librerie native pronte per le pagine da 16 KB (stesse librerie della release)
        run: python studio/check_native.py app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Dimensioni di pacchetti e APK (informativo; le bozze non sono gli asset definitivi)
        run: python studio/measure.py --apk app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirabo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          # Ogni APK pesa circa 100 MB: tenuti 90 giorni riempiono la quota del repository.
          retention-days: 7

  ios:
    # Anche sulle pull request: le due piattaforme si verificano presto
    # (docs/release-engineering.md), non solo dopo il merge.
    name: Compila iOS (senza firma)
    runs-on: macos-latest
    needs: [content, rilascio]
    # rilascio è saltato fuori dai tag: si prosegue; se fallisce, la build non parte
    if: ${{ !cancelled() && !failure() }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Versione esatta da app/pubspec.yaml: la build non cambia quando stable avanza.
          flutter-version-file: app/pubspec.yaml
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - run: python studio/keygen.py
      - run: python studio/sync_assets.py
      - working-directory: app
        run: flutter create . --org com.markg981 --project-name mirabo --platforms android,ios
      - name: Dipendenze esatte di app/pubspec.lock
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build ios --no-codesign
