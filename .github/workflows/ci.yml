name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Valida e impacchetta i contenuti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - name: Valida le storie
        run: python studio/validate.py
      - name: Pacchetti non firmati (la firma richiede la chiave privata, che non è in CI)
        run: python studio/pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacchetti
          path: dist/*.mirabo

  android:
    name: Analizza, testa e compila Android
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - name: Chiave di firma effimera per la CI
        run: python studio/keygen.py
      - name: Sincronizza gli asset
        run: python studio/sync_assets.py
      - name: Genera le cartelle piattaforma
        working-directory: app
        run: flutter create . --org com.markg981 --project-name mirabo --platforms android,ios
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mirabo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Compila iOS (senza firma)
    runs-on: macos-latest
    needs: content
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r studio/requirements.txt
      - run: python studio/keygen.py
      - run: python studio/sync_assets.py
      - working-directory: app
        run: flutter create . --org com.markg981 --project-name mirabo --platforms android,ios
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build ios --no-codesign
