name: mirabo
description: Storie e piccoli passi per crescere.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Dati locali
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  # Pacchetti contenuti: zip e verifica firma Ed25519
  archive: ^3.6.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  # Audio e voce
  just_audio: ^0.9.39
  flutter_tts: ^4.0.2
  # Markdown per le schede genitore
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Copiati da content/ con `python studio/sync_assets.py` (cartella ignorata da git)
    - assets/stories/
    - assets/companions/
