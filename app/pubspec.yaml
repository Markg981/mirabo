name: mirabo
description: Storie e piccoli passi per crescere.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Versione esatta: la CI la legge da qui (flutter-version-file) e le build di
  # release non cambiano quando il canale stable avanza. Insieme a pubspec.lock,
  # che è nel repository (docs/release-engineering.md).
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Dati locali
  # SQLite cifrato (SQLCipher); la chiave sta in flutter_secure_storage
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  # Pacchetti contenuti: zip e verifica firma Ed25519
  archive: ^3.6.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  # Audio e voce
  just_audio: ^0.9.39
  flutter_tts: ^4.0.2
  # Markdown per le schede genitore
  flutter_markdown: ^0.7.3
  # Stampabili per il genitore: PDF generati sul tablet, stampa o condivisione
  pdf: ^3.12.0
  printing: ^5.14.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  # Testi dell'interfaccia in lib/l10n/app_<lingua>.arb (italiano è la base).
  generate: true
  assets:
    # Copiati da content/ con `python studio/sync_assets.py` (cartella ignorata da git)
    - assets/stories/
    - assets/companions/
    - assets/education/
  # Font con licenza OFL (testi in fonts/OFL-*.txt). Fredoka per i titoli,
  # Nunito per i testi, Lexend per l'opzione "testo ad alta leggibilità".
  fonts:
    - family: Fredoka
      fonts:
        - asset: fonts/Fredoka-500.ttf
          weight: 500
        - asset: fonts/Fredoka-600.ttf
          weight: 600
        - asset: fonts/Fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-400.ttf
        - asset: fonts/Nunito-600.ttf
          weight: 600
        - asset: fonts/Nunito-700.ttf
          weight: 700
        - asset: fonts/Nunito-800.ttf
          weight: 800
        - asset: fonts/Nunito-900.ttf
          weight: 900
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-400.ttf
        - asset: fonts/Lexend-600.ttf
          weight: 600
        - asset: fonts/Lexend-700.ttf
          weight: 700
